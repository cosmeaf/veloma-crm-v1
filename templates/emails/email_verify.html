<!doctype html>
<html>
  <body style="margin:0;padding:0;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td align="center">
        <table width="600" cellpadding="20" cellspacing="0" role="presentation">
          <tr>
            <td>
              <h3 style="margin:0 0 12px;">Verifique o seu e-mail</h3>
              <p>Olá {{ user.first_name }},</p>
              <p>Para confirmar o seu e-mail, clique no botão abaixo:</p>
              <p>
                <a href="{{ verify_link }}" style="display:inline-block;padding:12px 18px;text-decoration:none;border-radius:6px;border:1px solid #222;">
                  Confirmar e-mail
                </a>
              </p>
              <p style="color:#666;">Se o botão não funcionar, copie e cole o link no navegador:</p>
              <p style="word-break:break-all;"><a href="{{ verify_link }}">{{ verify_link }}</a></p>
            </td>
          </tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>

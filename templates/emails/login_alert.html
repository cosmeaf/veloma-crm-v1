<!doctype html>
<html>
  <body style="margin:0;padding:0;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td align="center">
        <table width="600" cellpadding="20" cellspacing="0" role="presentation">
          <tr>
            <td>
              <h3 style="margin:0 0 12px;">Novo acesso detetado</h3>
              <p>Olá {{ user.first_name }},</p>
              <p>Detectámos um novo login na sua conta:</p>
              <ul>
                <li><strong>IP:</strong> {{ ip|default:"desconhecido" }}</li>
                <li><strong>Agente:</strong> {{ user_agent|default:"desconhecido" }}</li>
                <li><strong>Data/Hora (UTC):</strong> {{ when }}</li>
              </ul>
              <p style="color:#666;">Se não foi você, altere a sua palavra-passe e contacte o suporte.</p>
            </td>
          </tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
